<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Race Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>CourseWork App</h1>
  </header>

  <main>
    <section id="content" hidden>
      <!-- Container for dynamic views -->
    </section>
  </main>

  <!-- Stopwatch component template -->
  <template id="stopwatch-template">
    <section aria-label="Stopwatch">
      <time class="display" datetime="PT0S">00:00:00.000</time>
      <section class="controls" aria-label="Stopwatch controls">
        <button class="start" type="button">Start</button>
        <button class="stop" type="button" disabled>Stop</button>
      </section>
    </section>
  </template>

  <!-- Landing page layout -->
  <template id="landingPage">
    <section aria-label="Landing Page" class="relative">
      <!-- Disabled until results ready -->
      <button
        id="see-results"
        data-event-id=""
        disabled
        class="absolute top-4 right-4 px-4 py-2 rounded-xl shadow-sm opacity-50 cursor-not-allowed"
        type="button"
      >
        See Results
      </button>

      <!-- Results panel, hidden by default -->
      <aside
        id="results-container"
        aria-label="Event Results"
        class="absolute top-16 right-4 w-80 max-h-64 overflow-y-auto bg-white border rounded-lg shadow-lg p-4"
        hidden
      >
        <button
          id="close-results"
          type="button"
          aria-label="Close Results"
          class="absolute top-2 right-2 p-1 rounded-full bg-gray-200 hover:bg-gray-300 focus:outline-none focus:ring"
        >&times;
        </button>

        <ul id="results-list" class="list-disc pl-5 space-y-1">
          <!-- Populated with result lines -->
        </ul>
        <button
          id="download-results"
          type="button"
          hidden
          class="mt-3 px-4 py-2 rounded-xl shadow-sm bg-blue-600 text-white hover:bg-blue-700"
        >
          Download CSV
        </button>
      </aside>

      <!-- Embedded stopwatch -->
      <section aria-label="Landing stopwatch">
        <stop-watch></stop-watch>
      </section>

      <!-- Role selection controls -->
      <fieldset aria-label="Role selection" class="role-selection flex gap-4 border-none p-0 m-0">
        <legend class="sr-only">Choose your role</legend>
        <label for="role-volunteer">
          <input type="radio" id="role-volunteer" name="role" value="volunteer" checked />
          Volunteer
        </label>
        <label for="role-organiser">
          <input type="radio" id="role-organiser" name="role" value="organiser" />
          Organiser
        </label>
        <label for="role-gate-agent">
          <input type="radio" id="role-gate-agent" name="role" value="gate agent" />
          Gate Agent
        </label>
      </fieldset>
      <button id="btn-enter" type="button" class="mt-4 px-4 py-2 bg-green-600 text-white rounded-xl hover:bg-green-700">
        Enter
      </button>
    </section>
  </template>

  <!-- Organiser dashboard template -->
  <template id="organiserPage">
    <section aria-label="Organiser Page">
      <nav aria-label="Navigation">
        <button type="button" class="back-btn">← Back</button>
        <button type="button" class="records-btn">Records</button>
      </nav>

      <h2>Organiser Dashboard</h2>
      <stop-watch controls></stop-watch>

      <!-- List of event records -->
      <section class="records-section" hidden aria-label="Event Records">
        <h3>Event Records</h3>
        <ul class="records-list"></ul>
        <button type="button" class="create-report-btn">Create Final Report</button>
      </section>

      <!-- Detailed record view -->
      <section class="record-detail-section" hidden aria-label="Record Details">
        <h3>Record Details</h3>
        <pre class="csv-preview" tabindex="0" style="overflow:auto; max-height:300px;"></pre>
        <button type="button" class="close-detail-btn">Close</button>
        <button type="button" class="choose-btn">Choose as final times</button>
      </section>
    </section>
  </template>

  <!-- Gate Order Agent interface template -->
  <template id="gate-order-agent-page-template">
    <section aria-label="Gate Order Agent">
      <button type="button" class="back-btn" aria-label="Go back">← Back</button>
      <h2>Gate Order Agent</h2>

      <form id="gate-order-form">
        <fieldset>
          <legend>Entry Details</legend>
          <label for="bib-number">
            Bib Number:
            <input type="number" id="bib-number" name="bib-number" required aria-required="true" />
          </label>
          <label for="order-number">
            Order Number:
            <input type="number" id="order-number" name="order-number" required min="1" aria-required="true" />
          </label>
          <label for="auto-order">
            <input type="checkbox" id="auto-order" name="auto-order" /> Auto
          </label>
        </fieldset>
        <button type="submit">Add Entry</button>
      </form>

      <!-- Display list of ordered bibs -->
      <section aria-label="Ordered Bib List">
        <h3>Entries</h3>
        <ul id="order-list"></ul>
      </section>
    </section>
  </template>

  <!-- Volunteer dashboard template -->
  <template id="volunteerPage">
    <section aria-label="Volunteer Page">
      <nav aria-label="Navigation">
        <button type="button" class="back-btn">← Back</button>
      </nav>
      <h2>Volunteer Dashboard</h2>
      <button type="button" id="btn-submit">Submit</button>
      <stop-watch></stop-watch>
      <timing-list></timing-list>
    </section>
  </template>

  <!-- Timing list template -->
  <template id="timing-list-template">
    <section class="timing-list" aria-label="Timing List">
      <button type="button" class="passed-btn">Passed</button>
      <ul class="records" aria-live="polite"></ul>
    </section>
  </template>

  <!-- Event selection screen template -->
  <template id="event-selection-template">
    <section aria-label="Select Event">
      <h2>Select an Event</h2>
      <ul class="event-list"></ul>
      <p class="error-msg" hidden>Could not load events. Please try again later.</p>
    </section>
  </template>

  <!-- Template for each event item -->
  <template id="event-item-template">
    <li class="event-item">
      <h3 class="event-name"></h3>
      <button class="details-btn" type="button" aria-expanded="false">Details</button>
      <button class="select-btn" type="button">Select</button>
      <section class="event-details" hidden aria-hidden="true">
        <button class="close-btn" type="button" aria-label="Close details">×</button>
        <p class="event-description"></p>
        <p class="event-location"></p>
        <p class="event-start-time"></p>
      </section>
    </li>
  </template>

  <footer>
    <small>&copy; 2025 My CourseWork</small>
  </footer>

  <script type="module" src="stopwatch.mjs"></script>
  <script type="module" src="timingList.mjs"></script>
  <script type="module" src="eventSelectionScreen.mjs"></script>
  <script type="module" src="eventLanding.mjs"></script>
  <script type="module" src="volunteer.mjs"></script>
  <script type="module" src="organiser.mjs"></script>
  <script type="module" src="index.mjs"></script>
  <script type="module">
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          // Register service worker for offline support
          const registration = await navigator.serviceWorker.register('/sw.mjs', { type: 'module' });
          console.log('Service Worker registered:', registration);
        } catch (err) {
          console.error('SW registration failed:', err);
        }
      });
    }
  </script>
</body>
</html>
